[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "asleeps"
version = "2026.10.8.0"
authors = [
    {name = "Ann T Ropea", email = "bedhanger@gmx.de"},
]
description = "Simulate async sleeps"
#readme = "README.rst"
license = "MIT"
dependencies = []

[project.scripts]
asleeps = "asleeps:main"

[project.urls]
Homepage = "https://gitlab.com/bedhanger/mwe/-/tree/master/python/asleeps"

[tool.pytest.ini_options]
